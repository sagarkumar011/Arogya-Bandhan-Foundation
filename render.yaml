# ===============================================================
# AROGYA BANDHAN FOUNDATION - RENDER BLUEPRINT
# Tagline: "Healthy People | Stronger Communities"
# ===============================================================

services:
  - type: web
    name: arogya-bandhan-foundation
    runtime: node
    plan: free
    region: oregon
    buildCommand: npx prisma generate && npx prisma db push && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Set in Render Dashboard with Render PostgreSQL Internal Database URL
      - key: JWT_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_SITE_URL
        value: https://arogya-bandhan-foundation-2.onrender.com
      - key: NEXT_PUBLIC_APP_URL
        value: https://arogya-bandhan-foundation-2.onrender.com
      - key: NEXT_PUBLIC_API_URL
        value: https://arogya-bandhan-foundation-2.onrender.com
      - key: CORS_ORIGIN
        value: https://arogya-bandhan-foundation-2.onrender.com,http://localhost:3000
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
