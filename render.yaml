# ===============================================================
# AROGYA BANDHAN FOUNDATION - RENDER BLUEPRINT SPECIFICATION
# Architecture:
#   Backend API -> Render Web Service (Express: server/index.ts)
#   Database    -> Render Managed PostgreSQL
#   Frontend    -> Vercel (Next.js App with NEXT_PUBLIC_API_URL)
# ===============================================================

version: "1"

services:
  - type: web
    name: arogya-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npx prisma generate
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm run start:server
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: arogya-postgres-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENABLE_DEMO_LOGIN
        value: "true"
      - key: CORS_ORIGIN
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false

databases:
  - name: arogya-postgres-db
    plan: free
    region: oregon
    databaseName: arogya_bandhan
    user: arogya_admin
